<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar pedido</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body> 

     <header class="cabecalho">

        <div class="logo">
            <img src="imagens/logo.png" alt="Logo CIANS">
        </div>

        <div class="ftperfil">
            <img src="imagens/ftdperfil.jpg" alt="Foto de perfil">
        </div>

         <div class="texto"> Acompanhar pedido </div>

    </header>

    <nav class="menu">

        
        <a href="index.html" class="texto">
            Voltar
        </div>
        </a>

    </nav>

    <main class="container mt-5">

        <h2>Acompanhar pedido</h2>

        <div class="card pedido-card mt-4">
            <div class="card-body">

                <h4> Pedido a caminho</h4>
                <p class="text-secondary">Pedido #3</p>

                <hr>

                <div class="row align-items-center">

                    <div class="col-md-3">
                        <img src="imagens/headset4.jpg" class="img-fluid" alt="Headset">
                    </div>

                    <div class="col-md-6">
                        <h5>Headset branco</h5>
                        <p>Quantidade: 1</p>
                        <h5>R$ 188,90</h5>
                    </div>

                    <div class="col-md-3">
                        <p class="text-secondary">Previsão de entrega:</p>
                        <h5>11 de janeiro</h5>
                    </div>

                </div>

                <hr>

                <h5 class="mb-4">Andamento do pedido</h5>

                <div class="progresso">

                    <div class="etapa concluida">  
                        <p>Pedido confirmado ✓</p>
                    </div>

                    <div class="etapa concluida">
                        <p>Pagamento aprovado ✓</p>
                    </div>

                    <div class="etapa concluida">
                        <p>Pedido enviado ✓</p>
                    </div>

                    <div class="etapa atual">
                        <p>Em transporte - CHINA</p>
                    </div>

                    <div class="etapa">
                        <p>Entregue X</p>
                    </div>

                </div>

            </div>
        </div>
 
    </main>

</body>
</html>
