<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de compras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="cabecalho">

        <div class="logo">
            <img src="imagens/logo.png" alt="Logo CIANS">
        </div>

        <div class="ftperfil">
            <img src="imagens/ftdperfil.jpg" alt="Foto de perfil">
        </div>

         <div class="texto"> Histórico de compras</div>

    </header>

    <nav class="menu">

        <a href="index.html" class="texto">
            Voltar
        </div>
        </a>

    </nav>

    <main>

        <section class="container produtos">

            <h2 class="titulo-produtos">
                Seus últimos pedidos:
            </h2>

            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">

                <div class="col">
                    <div class="card produto-card">

                        <img src="imagens/headset4.jpg" class="card-img-top" alt="Headset Branco">

                        <div class="card-body">

                            <h5 class="card-title">Headset Branco</h5>

                            <p class="preco">Previsto 12 nov.</p>

                            <p class="descontooo">R$ 188,90</p>

                            <a href="acompanhar.html" class="btn btn-comprarr"> Enviado</a>

                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card produto-card">

                        <img src="imagens/monitorgamer.jpg" class="card-img-top" alt="monitor">

                        <div class="card-body">

                            <h5 class="card-title">Monitor</h5>

                            <p class="preco">28 ago.</p>

                            <p class="descontooo"> R$ 560,90</p>

                            <a class="btn btn-vizualizar"> Entregue</a>
                           
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card produto-card">

                        <img src="imagens/teclado2.jpg" class="card-img-top" alt="Teclado">

                        <div class="card-body">

                            <h5 class="card-title"> Teclado gamer com LED </h5>

                            <p class="preco">28 ago.</p>

                            <p class="descontooo">R$ 99,90</p>

                            <a class="btn btn-vizualizar"> Entregue</a>

                        </div>
                    </div>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
