<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body> 

     <header class="cabecalho">

        <div class="logo">
            <img src="imagens/logo.png" alt="Logo CIANS">
        </div>

        <div class="ftperfil">
            <img src="imagens/ftdperfil.jpg" alt="Foto de perfil">
        </div>

         <div class="texto">  Login</div>

    </header>

    <nav class="menu">

        <a href="index.html" class="texto">
            Voltar
        </div>
        </a>

    </nav>

    <div class="balaodlogin">

    <div class="container d-flex justify-content-center align-items-start vh-100 pt-3">

        <div class="card shadow p-4" style="width: 400px;">

            <h2 class="text-center mb-4">Entrar no CIANS</h2>

            <form>
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control"
                    placeholder="Digite seu e-mail">
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control"
                    placeholder="Digite sua senha">
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input">
                    <label class="form-check-label">
                        Lembrar de mim
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Entrar
                </button>
            </form>

            <p class="text-center mt-3">
                Não tem conta? <a href="#">Cadastre-se</a>
            </p>

        </div>
    </div>
</div>

</body>

</html>
