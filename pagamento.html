<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

 
</head>

<body>

     <header class="cabecalho">

        <div class="logo">
            <img src="imagens/logo.png" alt="Logo CIANS">
        </div>

        <div class="ftperfil">
            <img src="imagens/ftdperfil.jpg" alt="Foto de perfil">
        </div>

         <div class="texto"> Página de pagamento</div>

    </header>

    <nav class="menu">

        <a href="index.html" class="texto">
            Voltar
        </div>
        </a>

    </nav>

    <main class="container my-5">

        <div class="row g-4">
 
            <div class="col-lg-7">

                <div class="card shadow-sm p-4">

                    <h4 class="mb-4">Dados pessoais</h4>

                    <form>

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">Nome completo</label>
                                <input type="text" class="form-control" placeholder="Seu nome">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">CPF</label>
                                <input type="text" class="form-control" placeholder="000.000.000-00">
                            </div>

                            <div class="col-12">
                                <label class="form-label">E-mail</label>
                                <input type="email" class="form-control" placeholder="seuemail@email.com">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Telefone</label>
                                <input type="tel" class="form-control" placeholder="(00) 00000-0000">
                            </div>

                        </div>

                        <hr class="my-4">

                        <h4 class="mb-4">Endereço de entrega</h4>

                        <div class="row g-3">

                            <div class="col-md-8">
                                <label class="form-label">Endereço</label>
                                <input type="text" class="form-control" placeholder="Rua, avenida...">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Número</label>
                                <input type="text" class="form-control" placeholder="Nº">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Cidade</label>
                                <input type="text" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Estado</label>
                                <select class="form-select">
                                    <option selected>Selecione</option>
                                    <option>Rio Grande do Norte</option>
                                    <option>Paraíba</option>
                                    <option>Pernambuco</option>
                                    <option>Ceará</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">CEP</label>
                                <input type="text" class="form-control" placeholder="00000-000">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Complemento</label>
                                <input type="text" class="form-control" placeholder="Opcional">
                            </div>

                        </div>

                        <hr class="my-4">

                        <h4 class="mb-4">Forma de pagamento</h4>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="pagamento" id="pix" checked>
                            <label class="form-check-label" for="pix">
                                PIX
                            </label>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="pagamento" id="cartao">
                            <label class="form-check-label" for="cartao">
                                Cartão de débito
                            </label>
                        </div>
 

                        <div class="mt-4">
                            <label class="form-label">Observações do pedido</label>
                            <textarea class="form-control" rows="3" placeholder="Alguma observação?"></textarea>
                        </div>

                        <button type="submit" class="btn btn-finalizar w-100 mt-4">
                            Finalizar compra
                        </button>

                    </form>

                </div>

            </div>
 
            <div class="col-lg-5">

                <div class="card shadow-sm p-4">

                    <h4 class="mb-4">Resumo do pedido</h4>

                    <div class="d-flex justify-content-between mb-3">
                        <span> Gabinete Preto</span>
                        <strong>R$ 116,90</strong>
                    </div>

                    <div class="d-flex justify-content-between mb-3">
                        <span>Frete</span>
                        <strong>R$ 67,00</strong>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between mb-4">
                        <h5>Total</h5>
                        <h5>R$ 183,90</h5>
                    </div>

                    <div class="alert alert-info">
                        Confira seus dados antes de finalizar a compra.
                    </div>

                    <a href="index.html" class="btn btn-outline-secondary w-100">
                        Continuar comprando
                    </a>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
