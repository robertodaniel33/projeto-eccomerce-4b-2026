<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">

        <div class="logo">
            <img src="imagens/logo.png" alt="Logo CIANS">
        </div>

        <div class="ftperfil">
            <img src="imagens/ftdperfil.jpg" alt="Foto de perfil">
        </div>

        <div class="texto">Carrinho</div>

    </header>

    <nav class="menu">
        <a href="index.html" class="texto">
            Voltar
        </a>
    </nav>

    <main class="container my-5">

        <div class="mb-4">
            <h2 class="fw-bold">Meu carrinho</h2>
            <p class="text-muted">Confira os produtos antes de finalizar sua compra.</p>
        </div>

        <div class="row g-4">

            <div class="col-lg-8">
                <div class="container-carrinho">

                    <div class="item-carrinho">

                        <div class="informacoes-produto">
                            <img src="imagens/mouse1.jpg"
                                alt="mouse1">

                            <div>
                                <h6>Mouse Gamer</h6>
                                <small class="text-muted">Cor: Preto</small>
                            </div>
                        </div>

                        <div class="preco">R$ 88,90</div>

                        <div class="quantidade">
                            <button type="button">−</button>
                            <span class="numero-quantidade">1</span>
                            <button type="button">+</button>
                        </div>

                        <div class="total-item">R$ 88,90</div>

                    </div>

                </div>
            </div>

            <div class="col-lg-4">
                <div class="resumo-pedido">

                    <h5 class="fw-bold mb-4">Resumo do pedido</h5>

                    <div class="linha-resumo">
                        <span>Subtotal</span>
                        <span>R$ 88,90</span>
                    </div>

                    <div class="linha-resumo">
                        <span>Frete</span>
                        <span>Grátis</span>
                    </div>

                    <hr>

                    <div class="linha-resumo total">
                        <strong>Total</strong>
                        <strong>R$ 88,90</strong>
                    </div>

                    <a href="pagamento.html"
                       class="btn btn-comprar w-100 mb-2">
                        Comprar agora
                    </a>

                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
